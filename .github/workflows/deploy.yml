name: Deploy Two-Tier App to AKS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set up Kubectl
      uses: azure/setup-kubectl@v3

    - name: Set up Helm
      uses: azure/setup-helm@v3

    - name: Get AKS Credentials
      run: |
        az aks get-credentials --resource-group test --name test --overwrite-existing

    - name: Deploy Helm Chart
      run: |
        helm upgrade --install my-app ./two-tier-app --namespace default --atomic
