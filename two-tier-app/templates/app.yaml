apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-web-app
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: node-web-app
  template:
    metadata:
      labels:
        app: node-web-app
    spec:
      containers:
      - name: node-web-app
        image: "node:18-alpine"
        command: ["node", "-e", "require('http').createServer((req,res)=>{res.end('Hello from Node.js App!\n')}).listen(80)"]
        ports:
        - containerPort: 80
        env:
        - name: MONGO_URI
          value: "mongodb://mongo-service:27017/visitorDB"
---
apiVersion: v1
kind: Service
metadata:
  name: node-web-app-service
spec:
  selector:
    app: node-web-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
